<body>
    <main>
        <!--SECÇÃO DE FORMULÁRIO PARA AGENDAR COLETA DE LIXO-->
        <section class="container col-lg-6 pt-5 mt-5 bg-body-tertiary  shadow rounded-4">
            <div class="text-center">
                <h2 class="text-success">Contactos</h2>
                <p>Entre em Contacto conosco</p>
            </div>
            <form action="">
                <div>
                    <label for="inputtext5" class="form-label">Nome</label>
                    <input class="form-control" type="text" placeholder="" aria-label="input example" required>
                </div>
                <div class="mb-3">
                    <label for="exampleFormControlInput1" class="form-label">Email</label>
                    <input type="email" class="form-control" id="inputPassword" placeholder="" required>
                </div>
                <div class="mb-3">
                    <label for="inputAddress" class="form-label">Endereço</label>
                    <input type="text" class="form-control" id="inputAddress" placeholder="" required>
                </div>
                <div class="mb-3">
                    <label for="inputtext">O lixo está separado?</label>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault1">
                        <label class="form-check-label" for="radioDefault1">Sim</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault2">
                        <label class="form-check-label" for="radioDefault2">Não</label>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="inputtext">Quantidade de Lixo</label>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="" id="Pequena"><label
                            class="form-check-label" for="Pequena">Pequena
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="" id="Média" checked>
                        <label class="form-check-label" for="Média">Média</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="" id="Grande">
                        <label class="form-check-label" for="Grande">Grande</label>
                    </div>
                </div>
                <div class="mb-3">
                    <select class="form-select" aria-label="Default select example">
                        <option selected>Tipo de material</option>
                        <option>Plástico</option>
                        <option>Papel / Cartão</option>
                        <option>Vidro</option>
                        <option>Metal</option>
                        <option>Orgânico</option>
                        <option>Eletrónico</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="exampleFormControlTextarea1" class="form-label">Mensagem/Observações</label>
                    <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
                </div>
                <div class="mb-5">
                    <a class="btn btn-success col-lg-12" href="https://mail.google.com/mail/u/0/#inbox" role="button"
                        style="--bs-btn-padding-y: .25rem; --bs-btn-padding-x: .5rem; --bs-btn-font-size: .95rem;">Agendar</a>
                </div>
                </div>
            </form>
            <br>
    </main>
    <footer class="bg-success text-center py-1 fixed-bottom">
